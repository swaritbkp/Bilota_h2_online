# ==============================================================================
# Google App Engine (Standard Environment) Configuration
# ==============================================================================
runtime: python311
instance_class: F1

entrypoint: uvicorn src.app:app --host 0.0.0.0 --port $PORT

handlers:
  - url: /assets
    static_dir: src/ui/assets

  - url: /.*
    script: auto

env_variables:
  PYTHONPATH: "."
