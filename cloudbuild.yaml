# ==============================================================================
# Google Cloud Build Pipeline -> Google Cloud Run (GCP)
# ==============================================================================
steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/bilota-app:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/bilota-app:latest', '.']

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/bilota-app:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'bilota-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/bilota-app:$COMMIT_SHA'
      - '--region'
      - 'me-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/bilota-app:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/bilota-app:latest'
